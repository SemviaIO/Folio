name: Bug Report
description: Report a bug or unexpected behavior in Folio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Folio version
      description: Help → About, or the version shown on the updater prompt
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.3 (Apple Silicon)"
    validations:
      required: true
